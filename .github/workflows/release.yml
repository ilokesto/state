name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require explicit release-PR enablement
        run: node -e "const p=require('./.release/policy.json'); if (!p.releasePrEnabled) process.exit(1)"
      - name: Create or update release PR without publishing
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          commit: "ci: release"
          title: "ci: release"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify the generated release PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          set -euo pipefail
          head="$(gh pr view "$RELEASE_PR_NUMBER" --json headRefOid --jq .headRefOid)"
          gh workflow run ci.yml --ref changeset-release/main \
            -f expected_head_sha="$head" -f release_pr_number="$RELEASE_PR_NUMBER"
