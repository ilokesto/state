name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require explicit release-PR enablement
        run: node -e "const p=require('./.release/policy.json'); if (!p.releasePrEnabled) process.exit(1)"
      - name: Create or update release PR without publishing
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          commit: "ci: release"
          title: "ci: release"
        env:
          GITHUB_TOKEN: ${{ github.token }}
